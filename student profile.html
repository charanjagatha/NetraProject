 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body style="margin:0;">
    <main style="background:#f5f3ff;padding:16px;font-family:Arial,sans-serif;color:#0f172a;max-width:600px;margin:0 auto;">

        <div style="background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:18px;border-radius:16px;text-align:center;">
            <h1 style="margin:0;">Student Profile Page</h1>
        </div>

        <section style="background:white;padding:16px;margin-top:12px;border-radius:16px;text-align:center;box-shadow:0 3px 12px #ddd;">
            <h2 style="margin:0 0 12px;">About Me</h2>
            <img src="https://randomuser.me/api/portraits/men/85.jpg" alt="Sorry for inconvenience" width="80" height="80"
                 style="border-radius:50%;border:3px solid #4f46e5;object-fit:cover;">
            <p style="margin:8px 0 0;">Praveen Prakash | CSE</p>
        </section>

        <section style="background:white;padding:16px;margin-top:12px;border-radius:16px;">
            <h2 style="margin:0 0 12px;">My Skills</h2>
            <ul style="display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0;">
                <li style="background:#fef7e9;color:#4338ca;padding:8px 14px;border-radius:20px;">HTML</li>
                <li style="background:#fee9e9;color:#4338ca;padding:8px 14px;border-radius:20px;">Python</li>
                <li style="background:#08dec9;color:#4338ca;padding:8px 14px;border-radius:20px;">C</li>
                <li style="background:#320ae4;color:#4338ca;padding:8px 14px;border-radius:20px;">MySQL</li>
            </ul>
        </section>

        <section style="background:white;padding:16px;margin-top:12px;border-radius:16px;border-left:4px solid #4f46e5;">
            <h2 style="margin:0 0 12px;">My Projects</h2>
            <ol style="margin:0;padding-left:20px;line-height:1.8;">
                <li>Registration Page</li>
                <li>Library Management Page</li>
                <li>Student Profile Page</li>
            </ol>
        </section>

        <section style="background:white;padding:16px;margin-top:12px;border-radius:16px;box-shadow:0 3px 12px #ddd;">
            <h2 style="margin:0 0 12px;color:#0f172a;font-size:20px;">Course Registration</h2>
            <form action="" method="get">
                <label for="name">Full Name</label><br>
                <input type="text" name="name" id="name" placeholder="Enter Full Name" required
                       style="box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;">

                <label for="email">Email</label><br>
                <input type="email" name="email" id="email" placeholder="Enter Email" required
                       style="box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;">

                <label for="course">Course</label><br>
                <select name="course" id="course"
                        style="box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;">
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="html">HTML</option>
                </select>

                <p style="margin:0 0 12px;">Learning Mode<br>
                    <label for="online"><input type="radio" name="mode" id="online" value="online"> Online</label>
                    <label for="offline" style="margin-left:12px;"><input type="radio" name="mode" id="offline" value="offline"> Offline</label>
                </p>

                <label for="comment">Comments</label><br>
                <textarea name="comment" id="comment" cols="30" rows="4"
                          style="box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px;"></textarea>

                <p style="margin:0 0 16px;">
                    <label for="agree"><input type="checkbox" name="agree" id="agree" required> I agree to the terms and conditions</label>
                </p>

                <button type="submit"
                        style="background:#4f46e5;color:white;padding:10px 18px;border:0;border-radius:9px;cursor:pointer;">Register</button>
                <button type="reset"
                        style="background:#e2e8f0;color:#334155;padding:10px 18px;border:0;border-radius:9px;cursor:pointer;">Reset</button>
            </form>
        </section>

    </main>
</body>
</html>
